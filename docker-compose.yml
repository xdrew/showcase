version: '3.8'

services:
  monad-showcase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monad-showcase
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    networks:
      - monad-network

  nginx:
    image: nginx:alpine
    container_name: monad-nginx
    restart: unless-stopped
    ports:
      - "3001:80"
      - "3002:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-certs:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - monad-showcase
    networks:
      - monad-network

  certbot:
    image: certbot/certbot:latest
    container_name: monad-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - monad-network

networks:
  monad-network:
    driver: bridge

volumes:
  nginx-logs:
  certbot-certs:
  certbot-www:
