# HTTP Configuration
# Replace 'showcase.yourdomain.com' with your actual subdomain

server {
    listen 80;
    listen [::]:80;
    server_name showcase.monadungeon.xyz;

    # Uncomment these lines after setting up SSL
    # return 301 https://$server_name$request_uri;
# }

# HTTPS Configuration
# Uncomment after adding SSL certificates to nginx/ssl/
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name showcase.yourdomain.com;

#     ssl_certificate /etc/nginx/ssl/fullchain.pem;
#     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://monad-showcase:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
